<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Munba Buyback - Admin</title>
    <!--
    <script>
        (function() {
            const token = localStorage.getItem('token');
            if (!token) {
                console.warn('No authentication token found. Redirecting to login.');
                window.location.replace("index.html");
            }
        })();
    </script>
    -->

    <style>
        html {
            background-image: url('Media/Capitals_CrimHarvskin.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100%;
        }

        body {
            background-color: transparent;
            /* Ensure body doesn't obscure html background */
            font-family: Arial, sans-serif;
            height: 100%;
            /* Ensure body takes full height to allow scrolling over fixed background */
            margin: 0;
            /* Reset default body margin */
            color: white;
            opacity: 1;
            transition: opacity 0.2s ease-in;
            align-content: center;
        }

        header {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
            text-align: center;

        }

        .login-icon {
            height: 25px;
            cursor: pointer;
        }

        .contracts {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
        }

        .contract {
            border-bottom: 1px solid #ccc;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .contract:last-child {
            border-bottom: none;
        }

        .issuer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1em;
        }

        .issuer-row p {
            margin: 0;
        }

        .toggleItems {
            display: inline-block;
            margin-left: 1em;
        }

        .validation-indicator {
            font-size: 20px;
            margin-right: 10px;
            min-width: 25px;
            text-align: center;
        }

        .validation-valid {
            color: #4CAF50;
        }

        .validation-invalid {
            color: #f44336;
        }

        .validation-unknown {
            color: #ff9800;
        }

        .show-items-container {
            display: flex;
            align-items: center;
        }

        h2,
        h1 {
            text-align: center;
        }

        .issuer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1em;
        }

        .issuer-row p {
            margin: 0;
        }

        .contract {
            border-bottom: 1px solid #ccc;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .contract:last-child {
            border-bottom: none;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 10px 0;
        }

        nav a {
            color: #87cefa;
            text-decoration: none;
            font-weight: bold;
        }

        .tab-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-button.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .multipliers-editor {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
        }

        .multipliers-editor textarea {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            margin-top: 20px;
        }

        .multipliers-editor button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px 0 0;
        }

        .multipliers-editor button:hover {
            background: #45a049;
        }

        .multipliers-editor button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* New styles for the input form */
        .add-modifier-form {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            display: grid;
            grid-template-columns: 3fr 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            box-sizing: border-box;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #444;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            border-radius: 0 0 5px 5px;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .suggestion-item:hover {
            background: #4CAF50;
        }

        .suggestion-type {
            font-size: 0.8em;
            color: #aaa;
            float: right;
        }

        /* Readable List Styles */
        .readable-list {
            margin-top: 20px;
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .readable-list th,
        .readable-list td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .readable-list th {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }

        .readable-list tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .modifier-tag {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Contract Administration</h1>
        <div style="display: flex; justify-content: center; gap: 10px; margin: 10px 0;">
            <button id="contracts-tab" class="tab-button active">Outstanding Contracts</button>
            <button id="multipliers-tab" class="tab-button">Edit Multipliers</button>
        </div>
        <nav>
            <a href="index.html">Back to home</a>
            <a href="http://localhost:8000/login" id="relogin-link">Re-login</a>
            <button id="refresh-contracts"
                style="background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;">Refresh
                Contracts</button>
        </nav>
    </header>

    <main>
        <section class="tab-content active" id="contracts-content">
            <h2>Outstanding contracts</h2>
            <div id="contract-list" class="contracts">Loading...</div>
        </section>

        <section class="tab-content" id="multipliers-content">
            <div class="multipliers-editor">
                <h2>Edit Multipliers</h2>

                <div class="add-modifier-form">
                    <h3>Add / Update Modifier</h3>
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="text" id="search-input" class="input-field"
                                placeholder="Search Item or Group (e.g., Tritanium, Ore, 34)..." autocomplete="off">
                            <div id="suggestions" class="suggestions-list"></div>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="modifier-input" class="input-field" placeholder="%" step="0.1"
                                min="0" max="200">
                        </div>
                        <button id="add-modifier-btn">Add</button>
                    </div>
                    <p style="font-size: 0.9em; color: #ccc; margin-top: 5px;">
                        Select an item/group and enter a percentage (e.g., 90 for 90%).
                    </p>
                </div>

                <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

                <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                    <h3 style="margin:0;">Raw JSON Editor</h3>
                    <div>
                        <span id="multipliers-status" style="margin-right: 10px; font-style: italic;"></span>
                        <button id="save-multipliers">Save JSON</button>
                        <button id="download-multipliers" style="background: #2196F3;">Download .json</button>
                        <button id="reload-multipliers">Reload</button>
                    </div>
                </div>
                <textarea id="multipliers-text" placeholder="Loading multipliers..."></textarea>

                <div id="readable-list-container">
                    <h3 style="margin-top: 30px; margin-bottom: 10px;">Active Modifiers List</h3>
                    <table class="readable-list">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Modifier</th>
                                <th style="width: 80px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="readable-list-body">
                        </tbody>
                    </table>
                </div>

            </div>
        </section>
    </main>

    <script src="Scripts/contractvalue.js"></script>
    <script src="Scripts/contractlist.js"></script>
    <script src="Scripts/admin-tabs.js"></script>
    <script>
    fetch('/api/config')
      .then(response => response.json())
      .then(config => {
        if (config.app_domain) {
          const relogin = document.getElementById('relogin-link');
          if (relogin) relogin.href = config.app_domain + '/login';
        }
        if (config.app_title) {
          document.title = config.app_title + ' - Admin';
        }
      })
      .catch(error => console.error('Error loading config:', error));
    </script>
</body>

</html>
